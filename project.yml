name: GooseCards
options:
  bundleIdPrefix: com.goosecards
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1,2"
    SUPPORTS_MACCATALYST: false
    DEVELOPMENT_ASSET_PATHS: ""

targets:
  GooseCards:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: GooseCards
    info:
      path: GooseCards/Info.plist
      properties:
        CFBundleDisplayName: Goose Cards
        UILaunchScreen: {}
        UIRequiresFullScreen: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSPhotoLibraryUsageDescription: "Goose Cards lets you pick a photo from your library to put on a flash card."
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.goosecards.app
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: true
        DEVELOPMENT_TEAM: R45CA69ASN
        CODE_SIGN_STYLE: Automatic
    scheme:
      testTargets:
        - GooseCardsTests
      gatherCoverageData: true

  GooseCardsTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: GooseCardsTests
    dependencies:
      - target: GooseCards
    settings:
      base:
        GENERATE_INFOPLIST_FILE: true
        DEVELOPMENT_TEAM: R45CA69ASN
        CODE_SIGN_STYLE: Automatic
